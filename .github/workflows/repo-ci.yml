name: repo-ci

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label. Callers pass a repo/org variable; default is GitHub-hosted.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 15
      no-tests-reason:
        description: Only for repos with no runnable test framework yet. A non-empty reason turns "no tests found" from a failure into a visible warning. Graders check it on every PR.
        type: string
        default: ""
      max-file-mb:
        description: Largest allowed non-LFS file in MB. Callers pass a repo/org variable.
        type: number
        default: 10
      allowed-email:
        description: Author and committer email allowed on pull request commits. An empty value falls back to the CI_ALLOWED_EMAIL repo or org variable.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  repo-ci:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tier line (README has exactly one tier line)
        shell: bash
        run: |
          readme=$(ls README.md README README.markdown readme.md 2>/dev/null | head -n1 || true)
          if [ -z "$readme" ]; then
            echo "::error::No README found. Fix: add a README with exactly one line 'Repo tier: TEST' or 'Repo tier: PROD'."
            echo "Fix it on this same PR: push the fix to this branch. Do not close and reopen a copy. Do not rerun CI without a change."
            exit 1
          fi
          all=$(grep -c '^Repo tier:' "$readme" || true)
          ok=$(grep -cE '^Repo tier: (TEST|PROD)[[:space:]]*$' "$readme" || true)
          if [ "$all" != "1" ] || [ "$ok" != "1" ]; then
            echo "::error file=$readme::Need exactly one line 'Repo tier: TEST' or 'Repo tier: PROD' (found $all tier lines, $ok valid). Fix: leave exactly one line 'Repo tier: TEST' or 'Repo tier: PROD' in $readme."
            echo "Fix it on this same PR: push the fix to this branch. Do not close and reopen a copy. Do not rerun CI without a change."
            exit 1
          fi
          echo "$(grep -E '^Repo tier:' "$readme")"

      - name: "PR identity (linked issue; body and every commit: one Doer, one Grader, different seats; allowed commit email)"
        shell: python3 {0}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ALLOWED_EMAIL: ${{ inputs.allowed-email || vars.CI_ALLOWED_EMAIL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import os, re, subprocess, sys, unicodedata, urllib.request
          SAME_PR = (
              "Fix it on this same PR: edit the PR body or push the fix to this branch. "
              "Do not close and reopen a copy. Do not rerun CI without a change."
          )
          BODY_MAX_LINES = 12
          SEATS_URL = "https://raw.githubusercontent.com/dreadedpotato/.github/main/seats.txt"
          event = (os.environ.get("EVENT_NAME") or "").strip()
          if not event:
              print("::error::EVENT_NAME is empty. Fix: set EVENT_NAME to pull_request or pull_request_target.")
              print(SAME_PR)
              sys.exit(1)
          if event not in ("pull_request", "pull_request_target"):
              notice = f"PR identity check not applicable to event '{event}' (runs on pull_request and pull_request_target)"
              print(f"::notice::{notice}")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write(notice + "\n")
              sys.exit(0)
          body = (os.environ.get("PR_BODY") or "").replace("\r", "")
          body = re.sub(r"<!--.*?(?:-->|\Z)", "", body, flags=re.S)
          base = (os.environ.get("BASE_SHA") or "").strip()
          head = (os.environ.get("HEAD_SHA") or "").strip()
          allowed = (os.environ.get("ALLOWED_EMAIL") or "").strip()
          errs = []
          def norm(s):
              s = unicodedata.normalize("NFKC", s)
              s = "".join(ch for ch in s if unicodedata.category(ch) != "Cf")
              s = re.sub(r"\s+", " ", s).strip().casefold()
              return s
          def shown_seat(raw):
              return re.sub(r"\s*\([^)]*\)\s*$", "", raw).strip()
          def seat_key(raw):
              return norm(shown_seat(raw))
          def load_seats():
              path = (os.environ.get("SEATS_FILE") or "").strip()
              repo = (os.environ.get("GITHUB_REPOSITORY") or "").strip()
              local = "./seats.txt"
              try:
                  if path:
                      with open(path, encoding="utf-8") as handle:
                          text = handle.read()
                  elif repo == "dreadedpotato/.github" and os.path.isfile(local):
                      with open(local, encoding="utf-8") as handle:
                          text = handle.read()
                  else:
                      with urllib.request.urlopen(SEATS_URL, timeout=10) as handle:
                          text = handle.read().decode("utf-8")
              except Exception:
                  return None
              display = []
              seats = set()
              for raw in text.replace("\r", "").split("\n"):
                  line = raw.strip()
                  if not line:
                      continue
                  key = norm(line)
                  if not key:
                      continue
                  display.append(line)
                  seats.add(key)
                  seats.add(key.split(" ", 1)[0])
              if not display:
                  return None
              fix = ", ".join(display) + " (a first name alone is fine)"
              return seats, fix
          def merge_tree_write_tree_supported():
              raw, err = git_out(["version"])
              if raw is None:
                  return False, err or "git version failed"
              m = re.search(r"git version (\d+)\.(\d+)", raw)
              if not m:
                  return False, f"could not parse a git version from {raw.strip()!r}"
              ver = (int(m.group(1)), int(m.group(2)))
              if ver < (2, 38):
                  return False, (
                      f"git {ver[0]}.{ver[1]} does not support merge-tree --write-tree "
                      f"(need 2.38 or later)"
                  )
              return True, ""
          def base_sync_skip(sha, base_sha):
              raw, _err = git_out(["log", "-1", "--format=%P", sha])
              if raw is None:
                  return "noskip", ""
              parents = raw.split()
              if len(parents) != 2:
                  return "noskip", ""
              for parent in parents[1:]:
                  out, _err = git_out(["merge-base", "--is-ancestor", parent, base_sha])
                  if out is None:
                      return "noskip", ""
              ok, why = merge_tree_write_tree_supported()
              if not ok:
                  return "unavailable", why
              tree, terr = git_out(["merge-tree", "--write-tree", parents[0], parents[1]])
              if tree is None:
                  low = (terr or "").lower()
                  if any(s in low for s in ("unknown option", "unknown switch", "not a git command")):
                      return "unavailable", f"git merge-tree --write-tree is unavailable ({terr})"
                  return "noskip", ""
              actual, _err = git_out(["rev-parse", f"{sha}^{{tree}}"])
              if actual is None or tree.strip() != actual.strip():
                  return "noskip", ""
              return "skip", ""
          def git_out(args):
              try:
                  proc = subprocess.run(["git", *args], capture_output=True, text=True)
              except OSError as exc:
                  return None, str(exc)
              if proc.returncode != 0:
                  detail = (proc.stderr or proc.stdout or "").strip()
                  return None, detail
              return proc.stdout, ""
          def caller_tier():
              if not base:
                  return "PROD"
              for name in ("README.md", "README", "README.markdown", "readme.md"):
                  out, _err = git_out(["show", f"{base}:{name}"])
                  if out is None:
                      continue
                  raw = out.replace("\r", "")
                  found = re.findall(r"^Repo tier: (TEST|PROD)\s*$", raw, re.M)
                  if len(found) != 1:
                      return "PROD"
                  return found[0]
              return "PROD"
          def check_roles(text, label):
              def note(msg):
                  errs.append(f"{label} {msg}" if label else msg)
              def role_line(msg):
                  if label.startswith("commit "):
                      return (
                          msg
                          + " The line must be a trailer in the last paragraph of the commit message."
                      )
                  return msg
              text = text.replace("\r", "")
              accepted = {}
              for name in ("Doer", "Grader"):
                  ms = re.findall(rf"^[ \t]*{name}[ \t]*:[ \t]*(.*?)[ \t]*$", text, re.I | re.M)
                  if len(ms) > 1:
                      note(
                          role_line(
                              f"must have exactly one '{name}:' line (found {len(ms)}). "
                              f"Fix: leave exactly one '{name}:' line."
                          )
                      )
                  elif len(ms) == 0 or not ms[0].strip():
                      if name == "Doer":
                          note(
                              role_line(
                                  "needs a filled-in 'Doer:' line. Fix: add one line 'Doer: <current seat>'."
                              )
                          )
                      else:
                          note(
                              role_line(
                                  "needs a filled-in 'Grader:' line. "
                                  "Fix: add one line 'Grader: <current seat or self-merge>'."
                              )
                          )
                  else:
                      accepted[name] = ms[0].strip()
              if "Doer" in accepted and seat_key(accepted["Doer"]) not in SEATS:
                  note(
                      f"Doer value {shown_seat(accepted['Doer'])!r} is not a current seat. "
                      f"Fix: set Doer to one of {SEAT_FIX}."
                  )
              if (
                  "Grader" in accepted
                  and seat_key(accepted["Grader"]) != "self-merge"
                  and seat_key(accepted["Grader"]) not in SEATS
              ):
                  note(
                      f"Grader value {shown_seat(accepted['Grader'])!r} is not a current seat. "
                      f"Fix: set Grader to one of {SEAT_FIX}, or exactly self-merge."
                  )
              if (
                  "Doer" in accepted
                  and "Grader" in accepted
                  and seat_key(accepted["Grader"]) != "self-merge"
                  and seat_key(accepted["Doer"]) == seat_key(accepted["Grader"])
              ):
                  note(
                      "Doer and Grader name the same seat. "
                      "Fix: set Grader to a different current seat, or exactly self-merge."
                  )
              if (
                  "Grader" in accepted
                  and seat_key(accepted["Grader"]) == "self-merge"
                  and tier == "PROD"
              ):
                  errs.append(
                      "Grader: self-merge is not allowed on a PROD repo (README says Repo tier: PROD). "
                      "Fix: set Grader: Hester Quill (a named current seat) in the PR body and the commit trailers."
                  )
          loaded = load_seats()
          if loaded is None:
              print(
                  "::error::Could not read the seat list from "
                  + SEATS_URL
                  + ". Fix: check that seats.txt exists on dreadedpotato/.github main; this is not a PR-body problem."
              )
              sys.exit(1)
          SEATS, SEAT_FIX = loaded
          if not allowed:
              errs.append(
                  "ALLOWED_EMAIL is empty. "
                  "Fix: set the allowed-email input or the CI_ALLOWED_EMAIL repository or organization variable."
              )
          if not body.strip():
              errs.append(
                  "PR body is empty. "
                  "Fix: write the PR body in the repo-loop template, starting with 'For Dread: <what this PR is>'."
              )
          lines = [ln for ln in body.split("\n") if ln.strip()]
          if not lines or not re.match(r"^For Dread:\s*\S", lines[0]):
              errs.append(
                  "PR body first non-blank line does not match ^For Dread:\\s*\\S. "
                  "Fix: start the body with 'For Dread: <what this PR is>'."
              )
          if len(lines) > BODY_MAX_LINES:
              errs.append(
                  f"PR body has {len(lines)} non-blank lines, more than {BODY_MAX_LINES}. "
                  f"Fix: delete non-blank lines until {BODY_MAX_LINES} or fewer remain."
              )
          repo_name = (os.environ.get("GITHUB_REPOSITORY") or "").strip()
          issue_fix = f"Issue: https://github.com/{repo_name or '<owner>/<repo>'}/issues/<n>"
          raw_body = (os.environ.get("PR_BODY") or "").replace("\r", "")
          closing = re.search(
              r"\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b[^\S\n]*:?[^\S\n]*"
              r"(?:#\d+|GH-\d+|[\w.-]+/[\w.-]+#\d+|https?://github\.com/[\w.-]+/[\w.-]+/issues/\d+)",
              raw_body + "\n" + re.sub(r"[*_`\[\]]", "", raw_body),
              re.I,
          )
          if closing:
              errs.append(
                  f"PR body uses the closing keyword {closing.group(0)!r}, so GitHub would close the issue on merge "
                  "before it is validated. "
                  f"Fix: delete the closing keyword and link the issue with the line '{issue_fix}'."
              )
          if not repo_name:
              errs.append(
                  "GITHUB_REPOSITORY is empty, so the issue link cannot be matched to this repo. "
                  "Fix: run this check from a pull_request workflow, where GitHub sets GITHUB_REPOSITORY."
              )
          elif not re.search(
              r"^[ \t]*Issue[ \t]*:[ \t]*https://github\.com/" + re.escape(repo_name) + r"/issues/\d+[ \t]*$",
              body,
              re.I | re.M,
          ):
              errs.append(
                  f"PR body must link an issue in {repo_name} by URL on its own line. "
                  f"Fix: add the line '{issue_fix}'."
              )
          tested_vals = re.findall(r"^[ \t]*Tested[ \t]*:[ \t]*(.*?)[ \t]*$", body, re.I | re.M)
          if not any(v.strip() for v in tested_vals):
              errs.append(
                  "PR body needs a Tested: line with non-empty text. "
                  "Fix: add a line 'Tested: <command you ran and the result>'."
              )
          tier = caller_tier()
          check_roles(body, "PR body")
          head_ref = (os.environ.get("HEAD_REF") or "").strip()
          legacy_vals = re.findall(
              r"^[ \t]*Legacy through[ \t]*:[ \t]*(.*?)[ \t]*$",
              body,
              re.I | re.M,
          )
          legacy_skip = set()
          legacy_sha7 = ""
          raw_legacy = ""
          if len(legacy_vals) > 1:
              errs.append(
                  f"PR body has {len(legacy_vals)} 'Legacy through:' lines. "
                  "Fix: leave exactly one line 'Legacy through: <40-hex sha>'."
              )
          elif len(legacy_vals) == 1:
              raw_legacy = legacy_vals[0].strip()
              if not re.fullmatch(r"[0-9a-fA-F]{40}", raw_legacy):
                  errs.append(
                      f"'Legacy through:' value {raw_legacy!r} is not exactly 40 hex characters. "
                      "Fix: set the line to 'Legacy through: <40-hex sha>'."
                  )
                  raw_legacy = ""
              elif not (head_ref.startswith("poc/") and len(head_ref) > len("poc/")):
                  errs.append(
                      "'Legacy through:' is only allowed on a PR whose head branch matches poc/* "
                      f"(this head is '{head_ref}'). "
                      "Fix: delete the 'Legacy through:' line, or open the PR from a poc/* branch."
                  )
                  raw_legacy = ""
          if not base or not head:
              errs.append(
                  "BASE_SHA and HEAD_SHA are required. "
                  "Fix: set BASE_SHA and HEAD_SHA to the pull request base and head SHAs."
              )
          else:
              if event == "pull_request_target":
                  probe = subprocess.run(
                      ["git", "cat-file", "-e", head + "^{commit}"],
                      capture_output=True,
                      text=True,
                  )
                  if probe.returncode != 0:
                      fetch_env = os.environ.copy()
                      fetch_env["GIT_TERMINAL_PROMPT"] = "0"
                      subprocess.run(
                          ["git", "fetch", "--no-tags", "origin", head],
                          capture_output=True,
                          text=True,
                          env=fetch_env,
                      )
              if raw_legacy:
                  anc, _anc_err = git_out(["merge-base", "--is-ancestor", raw_legacy, head])
                  if anc is None:
                      errs.append(
                          f"'Legacy through:' sha {raw_legacy} is not an ancestor of the head. "
                          "Fix: name a commit already on this branch."
                      )
                  else:
                      listed_legacy, lgerr = git_out(["rev-list", f"{base}..{raw_legacy}"])
                      if listed_legacy is None:
                          errs.append(
                              f"git rev-list {base}..{raw_legacy} failed: {lgerr}. "
                              "Fix: name a commit already on this branch."
                          )
                      else:
                          legacy_skip = {
                              line.strip()
                              for line in listed_legacy.splitlines()
                              if line.strip()
                          }
                          legacy_sha7 = raw_legacy[:7]
              listed, gerr = git_out(["rev-list", "--reverse", f"{base}..{head}"])
              if listed is None:
                  errs.append(
                      f"git rev-list {base}..{head} failed: {gerr}. "
                      "Fix: fetch both commits so git rev-list can see the PR range."
                  )
              else:
                  shas = [line.strip() for line in listed.splitlines() if line.strip()]
                  if not shas:
                      errs.append(
                          "PR range contains zero commits. Fix: push at least one commit to this branch."
                      )
                  skipped_n = 0
                  for sha in shas:
                      if sha in legacy_skip:
                          skipped_n += 1
                          continue
                      short = sha[:7]
                      raw, gerr = git_out(["log", "-1", "--format=%ae%x00%ce%x00%B", sha])
                      if raw is None:
                          errs.append(
                              f"{short}: git log failed: {gerr}. "
                              f"Fix: make commit {short} readable with git log and push the fix to this branch."
                          )
                      else:
                          parts = raw.split("\0", 2)
                          if len(parts) != 3:
                              errs.append(
                                  f"{short}: commit record is incomplete. "
                                  f"Fix: record author email, committer email, and message on commit {short} and push the fix to this branch."
                              )
                          else:
                              author = parts[0].strip()
                              committer = parts[1].strip()
                              if author.lower() != allowed.lower():
                                  errs.append(
                                      f"{short}: author email {author!r} is not the allowed email {allowed!r}. "
                                      f"Fix: set the author email on commit {short} to {allowed!r} and push the fix to this branch."
                                  )
                              if committer.lower() != allowed.lower():
                                  errs.append(
                                      f"{short}: committer email {committer!r} is not the allowed email {allowed!r}. "
                                      f"Fix: set the committer email on commit {short} to {allowed!r} and push the fix to this branch."
                                  )
                              skip_state, skip_why = base_sync_skip(sha, base)
                              if skip_state == "skip":
                                  continue
                              roles, rerr = git_out(
                                  [
                                      "log",
                                      "-1",
                                      "--format=%(trailers:key=Doer)%(trailers:key=Grader)",
                                      sha,
                                  ]
                              )
                              before = len(errs)
                              if roles is None:
                                  errs.append(
                                      f"{short}: git log failed: {rerr}. "
                                      f"Fix: make commit {short} readable with git log and push the fix to this branch."
                                  )
                              else:
                                  check_roles(roles, f"commit {short}")
                              parent_line, _err = git_out(["log", "-1", "--format=%P", sha])
                              if parent_line is not None and len(parent_line.split()) >= 2:
                                  hint = (
                                      " A merge that only brings in the base branch is exempt when its other "
                                      "parent is already reachable from the base and git merge-tree --write-tree "
                                      "exits 0 with a tree that equals the merge commit. If this merge is not "
                                      "that shape, cherry-pick the feature commits onto a fresh branch off "
                                      "current main instead of merging main in."
                                  )
                                  if skip_state == "unavailable":
                                      hint = (
                                          f" This merge was not exempted: {skip_why}. "
                                          "Fix: use git 2.38 or later, or add Doer/Grader trailers on this "
                                          "merge, or cherry-pick the feature commits onto a fresh branch off "
                                          "current main."
                                      )
                                  for i in range(before, len(errs)):
                                      if errs[i].startswith(f"commit {short} "):
                                          errs[i] = errs[i] + hint
                  if legacy_sha7:
                      print(
                          f"::notice::Legacy through {legacy_sha7}: skipped the per-commit identity "
                          f"and email checks on {skipped_n} commits already graded on this POC branch; "
                          f"every later commit is still checked."
                      )
          for e in errs:
              print(f"::error::{e}")
          if errs:
              print(SAME_PR)
              sys.exit(1)
          print("PR identity ok")
          sys.exit(0)

      - name: File size (no non-LFS file over the limit)
        shell: bash
        env:
          MAX_MB: ${{ inputs.max-file-mb }}
        run: |
          limit=$(awk -v m="$MAX_MB" 'BEGIN { printf "%d", m * 1048576 }')
          bad=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            sz=$(stat -c %s "$f")
            if [ "$sz" -gt "$limit" ]; then
              echo "::error file=$f::$f is $(( sz / 1024 / 1024 )) MB, over the ${MAX_MB} MB limit. Fix: use Git LFS for this file or keep it outside git."
              bad=1
            fi
          done < <(git ls-files -z)
          if [ "$bad" -ne 0 ]; then
            echo "Fix it on this same PR: push the fix to this branch. Do not close and reopen a copy. Do not rerun CI without a change."
          fi
          exit $bad

      - name: Tests (repo's own entry; none found is a failure)
        shell: bash
        env:
          NO_TESTS_REASON: ${{ inputs.no-tests-reason }}
        run: |
          set -euo pipefail
          has_py_tests() {
            compgen -G 'tests/test_*.py' >/dev/null || compgen -G 'tests/*_test.py' >/dev/null \
              || compgen -G 'test_*.py' >/dev/null || compgen -G 'tests/**/test_*.py' >/dev/null
          }
          if [ -f Makefile ] && grep -qE '^test[[:space:]]*::?' Makefile; then
            make test
          elif [ -f package.json ] && node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)' 2>/dev/null; then
            if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
            npm test
          elif [ -f pytest.ini ] || grep -qs '\[tool.pytest' pyproject.toml || has_py_tests; then
            python3 -m venv "$RUNNER_TEMP/ci-venv"
            . "$RUNNER_TEMP/ci-venv/bin/activate"
            python -m pip install -q pip==26.2.2 pytest==9.2.0
            if [ -f requirements.txt ]; then python -m pip install -q -r requirements.txt; fi
            python -m pytest -q
          elif [ -f Cargo.toml ]; then
            cargo test --locked
          elif [ -n "$NO_TESTS_REASON" ]; then
            echo "::warning::No test entry found. Declared reason: $NO_TESTS_REASON"
            echo "### Tests not run. Declared reason: $NO_TESTS_REASON" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::No test entry found (make test, npm test, pytest, cargo test). Fix: add tests (a custom runner goes behind a make test target), or set no-tests-reason in the caller for a repo with no test framework yet."
            echo "Fix it on this same PR: push the fix to this branch. Do not close and reopen a copy. Do not rerun CI without a change."
            exit 1
          fi

      - name: Clean up (self-hosted runners only)
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true
          rm -rf "${RUNNER_TEMP:?}"/* 2>/dev/null || true
